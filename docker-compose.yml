# Usage:
#   JUPYTER_TOKEN=$(openssl rand -hex 16) docker compose up      # JupyterLab
#   docker compose run --rm octave-cli                           # Octave REPL
#   docker compose run --rm octave-cli make test                 # test suite

services:
  jupyter:
    build: .
    image: octavemasterpro:latest
    ports:
      - "127.0.0.1:8888:8888"   # local access only
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-}
    volumes:
      - ./:/home/researcher/OctaveMasterPro

  octave-cli:
    image: octavemasterpro:latest
    build: .
    profiles: ["cli"]
    volumes:
      - ./:/home/researcher/OctaveMasterPro
    command: octave --no-gui
    stdin_open: true
    tty: true
