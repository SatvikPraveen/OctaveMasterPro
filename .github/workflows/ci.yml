name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

jobs:
  test:
    name: Library tests (Octave ${{ matrix.os == 'ubuntu-24.04' && '8.4' || '6.4' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            octave octave-signal octave-statistics gnuplot-nox
      - name: Environment
        run: octave --no-gui --eval "addpath inst; omp.repro.env_info ('print');"
      - name: Unit and property tests
        run: octave --no-gui --eval "addpath tests; exit (! run_tests ());"
      - name: Parse check (all tracked .m files)
        run: octave --no-gui --eval "addpath tests; exit (! check_parse ());"
      - name: Documentation examples execute
        run: octave --no-gui --no-window-system --eval "addpath docs; exit (! check_usage_examples ());"

  experiment-smoke:
    name: Flagship experiment (quick mode)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends octave gnuplot-nox
      - name: Data audit and quick experiment
        run: |
          octave --no-gui --no-window-system --eval "
            addpath ('flagship_project/experiment');
            A = audit_shipped_data ('ci-results');
            R = run_pdm_experiment ('Quick', true, 'Figure', false, 'OutDir', 'ci-results');
            T = R.table;
            ctrl = [T(strcmp ({T.model}, 'shuffled_control')).auc];
            orac = [T(strcmp ({T.model}, 'oracle')).auc];
            printf ('control AUC %s | oracle AUC %s\n', mat2str (ctrl, 3), mat2str (orac, 3));
            exit (any (abs (ctrl - 0.5) > 0.15) || any (orac < 0.75));"
      - uses: actions/upload-artifact@v4
        with:
          name: quick-experiment-results
          path: ci-results/

  notebooks:
    name: Notebooks execute (Octave kernel)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave and Jupyter tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            octave octave-signal octave-statistics octave-parallel gnuplot-nox
          python3 -m pip install --user "nbclient" "nbformat" "octave_kernel==1.1.1"
          python3 -m octave_kernel install --user
      - name: Execute all notebooks
        env:
          OCTAVE_EXECUTABLE: octave-cli
        run: python3 tests/check_notebooks.py
